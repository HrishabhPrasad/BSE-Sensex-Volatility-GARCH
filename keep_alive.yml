name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (Streamlit sleeps after 12 hours)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Send a request to the Streamlit app
        run: |
          curl -sI https://bse-volatility.streamlit.app/ | head -n 1
